<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#211d19" />
    <title>Barber Shop · Offline</title>
    <style>
      body { margin: 0; background: #f6f5f3; color: #211d19; font: 18px/1.5 system-ui, sans-serif; }
      main { width: min(520px, calc(100% - 40px)); margin: 15vh auto; padding: 28px; border: 1px solid #e5e1dc; border-radius: 16px; background: #fff; }
      h1 { margin-top: 0; }
      button { padding: 10px 16px; border: 0; border-radius: 9px; background: #d96d25; color: #fff; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sei offline</h1>
      <p>Per cercare disponibilità o modificare una prenotazione serve una connessione internet.</p>
      <button type="button" onclick="location.reload()">Riprova</button>
    </main>
  </body>
</html>
